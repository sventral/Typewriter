<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100..900&display=swap" rel="stylesheet">
<title>Typomatique Guide</title>
  <style>
    :root{
      --font-body: "Raleway", sans-serif;
      --font-display: "Gravitas One", serif;
--paper:#f6f2ea;
      --paper2:#fbf9f4;
      --ink:#121212;
      --muted:rgba(18,18,18,.62);
      --hair:rgba(18,18,18,.14);
      --accent:#1f6f8b;
      --accentSoft: rgba(31,111,139,.12);
      --shadow: 0 22px 70px rgba(0,0,0,.22);
      --radius: 22px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: var(--font-body);
      font-optical-sizing: auto;
      font-weight: 450;
      font-style: normal;
      color:var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    html.embed-mode,
    body.embed-mode{
      background: transparent !important;
    }
    body.embed-mode::before{
      display:none;
    }

    /* Mid-century paper + swiss-ish grid */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(860px 660px at 18% 14%, rgba(31,111,139,.10), transparent 56%),
        radial-gradient(740px 580px at 82% 86%, rgba(198,106,61,.08), transparent 60%),
        linear-gradient(to bottom, rgba(255,255,255,.55), rgba(255,255,255,0) 36%),
        repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0, rgba(0,0,0,.035) 1px, transparent 1px, transparent 36px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.022) 0, rgba(0,0,0,.022) 1px, transparent 1px, transparent 90px);
      mix-blend-mode: multiply;
      opacity:.62;
    }

    .stage{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding: 32px 22px;
    }

    .open{
      border: 1px solid var(--hair);
      background: var(--paper2);
      color: var(--ink);
      border-radius: 999px;
      padding: 14px 22px 14px 18px;
      cursor: pointer;
      box-shadow: 0 12px 38px rgba(0,0,0,.13);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .open:hover{ transform: translateY(-1px); box-shadow: 0 16px 48px rgba(0,0,0,.17); border-color: rgba(0,0,0,.20); }
    .open:active{ transform: translateY(0); box-shadow: 0 12px 38px rgba(0,0,0,.13); }
    .open .chip{
      width: 34px; height: 34px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accentSoft), rgba(0,0,0,0));
      border: 1px solid rgba(0,0,0,.14);
      display:grid; place-items:center;
      font-family: var(--font-body);
      font-weight: 700;
      font-weight: 700;
      letter-spacing: .04em;
      transform: rotate(-2deg);
      user-select:none;
    }
    .open .label{ font-size: 18px; letter-spacing: .02em; }
    .open .hint{
      font-family: var(--font-body);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .raleway-ui{
      font-family: "Raleway", sans-serif;
      font-optical-sizing: auto;
      font-weight: 500;
      font-style: normal;
    }

    /* Overlay */
    .overlay{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      padding: 22px;
      z-index:9999;
    }
    .overlay.is-open{ display:flex; }

    .backdrop{
      position:absolute;
      inset:0;
      background: rgba(10,10,10,.44);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: fadeIn .16s ease both;
    }

    .panel{
      position:relative;
      width: min(1120px, calc(100vw - 44px));
      height: min(760px, calc(100vh - 44px));
      background: var(--paper2);
      border: 1px solid rgba(0,0,0,.12);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      display:grid;
      grid-template-rows: auto 1fr auto;
      animation: liftIn .20s ease both;
    }

    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 16px;
      padding: 14px 18px 12px 26px;
      border-bottom: 1px solid var(--hair);
      background: linear-gradient(to bottom, rgba(255,255,255,.55), rgba(255,255,255,0));
    }

    .titlewrap{
      display:flex;
      flex-direction:column;
      gap: 0px;
      min-width: 0;
    }

    .xbtn{
      width: 42px; height: 42px;
      border-radius: 999px;
      border: 1px solid var(--hair);
      background: transparent;
      cursor: pointer;
      display:grid;
      place-items:center;
      font-size: 22px;
      line-height: 1;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
    }
    .xbtn:hover{ transform: translateY(-1px); background: rgba(0,0,0,.04); border-color: rgba(0,0,0,.18); }

    .body{
      display:grid;
      grid-template-columns: 220px 1fr;
      min-height:0;
    }

    /* Left rail (Swiss index) */
    .rail{
      border-right: 1px solid var(--hair);
      padding: 16px 12px 16px 18px;
      min-height:0;
      overflow:auto;
      background: radial-gradient(420px 320px at 20% 20%, rgba(255,255,255,.75), rgba(255,255,255,0));
    }

    .rail h2{
      margin: 0 0 12px 0;
      font-size: 16px;
      letter-spacing:.02em;
      font-family: var(--font-body);
      font-weight: 650;
    }


    .navlist{
      list-style:none;
      padding:0;
      margin: 0;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .navitem button{
      width:100%;
      text-align:left;
      cursor:pointer;
      background: transparent;
      border: 1px solid transparent;
      padding: 10px 10px 10px 10px;
      border-radius: 14px;
      transition: background .14s ease, border-color .14s ease, transform .14s ease;
    }
    .navitem button:hover{
      background: rgba(0,0,0,.03);
      border-color: rgba(0,0,0,.10);
      transform: translateY(-1px);
    }
    .navitem .n{
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(18,18,18,.62);
      margin-bottom: 4px;
    }
    .navitem .t{
      font-size: 16px;
      line-height: 1.15;
      color: rgba(18,18,18,.92);
    }
    .navitem.is-active button{
      background: var(--accentSoft);
      border-color: rgba(0,0,0,.10);
    }

    /* Main reading area */
    .main{
      min-height:0;
      padding: 18px 18px 18px 18px;
      display:grid;
    }

    .page{
      border: 1px solid rgba(0,0,0,.10);
      border-radius: calc(var(--radius) - 6px);
      background: #fff;
      box-shadow: 0 12px 26px rgba(0,0,0,.09);
      overflow:auto;
      padding: 26px 22px 22px 22px;
      display: grid;
    }

    .page-layout{
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 22px;
      min-height: 100%;
      align-items: start;
    }

    /* Columns */
    .flow{ column-gap: 40px; }
    @media (min-width: 980px){
      .flow{ column-count: 2; }
    }

    .page-media{
      display: none;
      margin: 0;
      padding: 0;
      pointer-events: none;
    }

    .page-layout.has-media .page-media{
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .page-layout.has-side-media{
      grid-template-columns: minmax(0, 1fr) minmax(180px, 270px);
    }
    .page-layout.has-side-media .flow{
      column-count: 1;
    }
    .page-layout.has-side-media .page-media{
      position: static;
    }
    .page-layout.has-below-media .page-media{
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .page-layout.has-below-media .page-media-figure.strip{
      grid-column: 1 / -1;
    }

    .page-media-figure{
      margin: 0;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,.11);
      background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(244,240,232,.92));
      box-shadow: 0 8px 20px rgba(0,0,0,.07);
      width: min(100%, var(--media-frame-max-width, 100%));
    }
    .page-media-figure img{
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.08);
      background: #efece5;
    }
    .page-media-figure.strip img{
      object-fit: contain;
      object-position: left center;
    }
    .page-media-figure.texture img{
      min-height: 220px;
      object-fit: cover;
    }

    .block{
      break-inside: avoid-column;
      margin: 0 0 18px 0;
    }

    .blocktitle{
      column-span: all;
      margin: 0 0 10px 0;
      padding-top: 10px;
      border-top: 1px solid rgba(0,0,0,.10);
      position: relative;

      font-size: 22px;
      line-height: 1.15;
      letter-spacing: .01em;
      font-family: var(--font-display);
      font-weight: 400;

      white-space: nowrap;
      overflow: visible;
    }
    .flow > .blocktitle:first-child{
      border-top: 0;
      padding-top: 0;
    }
    .blocktitle::before{
      content:"";
      position:absolute;
      left:0;
      top:-1px;
      width: 64px;
      height: 2px;
      background: var(--accent);
      opacity: .9;
    }
    .flow > .blocktitle:first-child::before{ display:none; }

            .block:first-child::before{ display:none; }
    
    .block h4{
      margin: 14px 0 8px 0;
      font-family: var(--font-body);
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(18,18,18,.72);
    }

    .block p{
      margin: 0 0 12px 0;
      font-size: 16px;
      line-height: 1.55;
      color: rgba(18,18,18,.88);
      max-width: 72ch;
    
      font-weight: 450;
    }

    .block ul{
      margin: 0 0 12px 0;
      padding-left: 20px;
      max-width: 72ch;
    }
    .block li{ margin: 6px 0; line-height: 1.5; }

    .callout{
      break-inside: avoid-column;
      border: 1px solid rgba(0,0,0,.12);
      border-left: 3px solid var(--accent);
      border-radius: 16px;
      padding: 12px 12px;
      background: rgba(31,111,139,.06);
      margin: 12px 0;
    }

    .callout p{ margin:0; font-size: 15px; }

    strong{ font-weight: 700; }
    em{ font-style: italic; }

    /* Footer nav: left/right buttons, dots centered */
    .bottom{
      border-top: 1px solid var(--hair);
      padding: 12px 18px 12px 26px;
      background: linear-gradient(to top, rgba(255,255,255,.55), rgba(255,255,255,0));
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      gap: 12px;
    }

    .navbtn{
      width: 48px; height: 48px;
      border-radius: 999px;
      border: 1px solid var(--hair);
      background: rgba(0,0,0,.02);
      cursor:pointer;
      display:grid;
      place-items:center;
      transition: transform .16s ease, background .16s ease, border-color .16s ease;
      justify-self: start;
    }
    .navbtn.next{ justify-self: end; }
    .navbtn:hover{ transform: translateY(-1px); background: var(--accentSoft); border-color: rgba(0,0,0,.18); }
    .navbtn[disabled]{ opacity:.35; cursor:default; transform:none; background: rgba(0,0,0,.02); }

    .dots{
      display:flex;
      justify-content:center;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
      justify-self: center;
    }
    .dot{
      width: 10px; height: 10px;
      border-radius: 2px;
      border: 1px solid rgba(0,0,0,.22);
      background: transparent;
      cursor:pointer;
      transition: transform .14s ease, background .14s ease, border-color .14s ease;
    }
    .dot:hover{ transform: translateY(-1px); border-color: var(--accent); }
    .dot.is-active{ background: var(--accent); border-color: var(--accent); }

    @media (max-width: 920px){
      .body{ grid-template-columns: 1fr; }
      .rail{ display:none; }
      .page{ padding: 22px 18px; }
      .page-layout.has-side-media{ grid-template-columns: 1fr; }
      .page-layout.has-side-media .page-media{ position: static; }
      .page-layout.has-below-media .page-media{ grid-template-columns: 1fr; }
      .pagetitle{ font-size: 26px; }
    }

    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition:none !important; }
    }
    @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
    @keyframes liftIn{ from{ opacity:0; transform: translateY(10px) scale(.985); } to{ opacity:1; transform: translateY(0) scale(1); } }
  </style>
</head>
<body>
  <div class="overlay is-open" id="overlay" aria-hidden="false">
    <div class="backdrop" id="backdrop"></div>

    <section class="panel" role="dialog" aria-modal="true" aria-label="Guide">
      <header class="top">
        <div class="titlewrap">
</div>

        <button class="xbtn" id="closeGuide" type="button" aria-label="Close">×</button>
      </header>

      <div class="body">
        <aside class="rail" aria-label="Page index">
          <h2>Index</h2>
          <ol class="navlist" id="navlist"></ol>
        </aside>

        <section class="main">
          <div class="page" id="page">
            <div class="page-layout" id="pageLayout">
              <div class="flow" id="content"></div>
              <aside class="page-media" id="pageMedia" aria-label="Guide illustrations"></aside>
            </div>
          </div>
        </section>
      </div>

      <footer class="bottom">
        <button class="navbtn" id="prevBtn" type="button" aria-label="Previous page">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M14.5 5.5L8 12l6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="dots" id="dots" aria-label="Pages"></div>

        <button class="navbtn next" id="nextBtn" type="button" aria-label="Next page">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9.5 5.5L16 12l-6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </footer>
    </section>
  </div>

  <script>
    const EMBED_MODE = new URLSearchParams(window.location.search).get("embed") === "1";
    if (EMBED_MODE) {
      document.documentElement.classList.add("embed-mode");
      document.body.classList.add("embed-mode");
    }

    const PAGES = [{"kicker": "Intro", "title": "Introduction", "accent": "#1f6f8b", "blocks": [{"heading": "A short introduction", "body": "Typomatique can create pages that seem typed by a mechanical typewriter: slightly uneven letters, soft ink edges, small drift, and the occasional flaw."}]}, {"kicker": "Basics", "title": "File handling", "accent": "#c66a3d", "blocks": [{"heading": "Documents and saving", "body": "Use the **document strip** at the top left to create, delete or switch documents. Your work is by default saved locally as you go; you can also export the text or the document as a PDF."}]}, {"kicker": "Basics", "title": "Settings", "accent": "#6b7f2a", "blocks": [{"heading": "Opening the settings", "body": "Click the **gear button** at the bottom right to open the **settings pane**.\n\nBy the way, above the gear you see the **Color Picker** to set the colour of your text; click **...** for more options."}]}, {"kicker": "Page", "title": "Page", "accent": "#7a4c9e", "blocks": [{"heading": "Set the pitch and spacing", "body": "In **Page**, **CPI** (characters per inch) sets the basic pitch of the machine. Typewriters typically use 10 CPI (pica: wider, fewer characters per line) or 12 CPI (elite: tighter, more characters per line). As you switch between 10 and 12, the **Columns** readout updates to show how many characters fit on the current page and margins.\n\n**Size** adjusts the glyph size independently of CPI. It's mainly there to fine-tune how a particular font appears on the page, since some faces look more believable a touch larger or smaller even at the same pitch.\n\n**Line Height** controls the vertical advance between lines, using common typewriter spacings (1, 1.5, 2, 2.5, 3)."}]}, {"kicker": "Fonts", "title": "Fonts", "accent": "#b65b7c", "blocks": [{"heading": "Choose a typeface", "body": "In **Fonts** you can pick a built-in face, or load your own. \"Local\" accepts TTF/OTF/WOFF(2). \"Web\" accepts an @import URL. If the custom font has variants (for example italic), you can select them here."}]}, {"kicker": "Effects", "title": "Effects", "accent": "#2d6a4f", "blocks": [{"heading": "Shape the print", "body": "Most of the realism lives in **Effects**. Start lightly, then add what you miss.\n\n#### Dynamics\n\n**Line slant** introduces a slight angle shift, as if the paper isn't inserted perfectly straight in the machine.\n\n**Glyph jitter** adds small positional variation so letters don't sit perfectly straight on a line.\n\n**Character offset** can push specific characters above or below the baseline, so use it sparingly.\n\n#### Filters\n\n**Filters** add \"ink and wear\" realism: fuzzy edges, grain, smudge effects, tiny gaps, and similar. If you want a new \"personality\" for the page, press **Random**. Most of these random picks will look rather odd, but if you try a few times you might find something you can fine-tune. It's best to test filters when there's not too much text on the page. \n\n#### Performance notes\n\nFilters can affect performance (especially with larger documents). If typing or zooming starts to feel less smooth, reduce the number of active filters, or adjust **High-zoom performance mode**.\n\n#### Saving a good look\n\nWhen you get a result you like, save it as a style so you can reuse it. In **Manage styles** you can Save, Load, Delete, and also load/save styles to a file."}]}, {"kicker": "Behaviour", "title": "Behaviour", "accent": "#1f6f8b", "blocks": [{"heading": "Typing behaviour", "body": "By default, **Allow conventional text editing** in **Behaviour** is off. That means you cannot freely delete or insert text the way you would in a normal editor. Instead, Backspace mainly moves the caret, and typing on top of existing characters can overwrite them. This is intentional: overtyping (and the darker, messy buildup it creates) is a key part of a believable typewritten look. If you want regular editing, turn Allow conventional text editing on.\n\nKeep an eye on the **MR button** at the bottom left. As the cursor moves closer to the right margin, the letters 'MR' on this button will darken. Click it to release the margin stop and continue typing beyond the margin on that line.\n\n**Enable caret lock** keeps the typing point steady on screen by moving the page under it. You can turn it off if you prefer the page to stay put.\n\n#### Bells and margin stop \n\nIf you want the \"end of line\" bell-and-whistle, enable **Bell sound** and/or **Stop sound**, then set **Bell warning (chars)**. When stop behaviour is active, **Word Wrap** is disabled by design."}]}, {"kicker": "Sync", "title": "Sync", "accent": "#c66a3d", "blocks": [{"heading": "Saving across devices", "body": "If you want your documents and settings across devices, use **Sync**. It connects to Dropbox to store your document and settings data."}]}];

    const PAGE_MEDIA = {
      "Introduction": {
        placement: "below",
        items: [
          {
            src: "image/introduction.png",
            alt: "Close-up sample of typed text output",
            width: 3210,

            variant: "texture"

        ]
      },
      "File handling": {

          {

    function escapeHtml(s){
      return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
    }
    function inlineFormat(s){
      s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|[^\*])\*(?!\s)(.+?)(?<!\s)\*/g, "$1<em>$2</em>");
      return s;
    }

    function mdToHtml(md){
      const lines = md.replace(/\r\n/g,"\n").split("\n");
      let html = "";
      let para = [];
      let inList = false;

      function flushPara(){
        if(para.length){
          const text = inlineFormat(escapeHtml(para.join(" ").trim()));
          html += `<p>${text}</p>`;
          para = [];
        }
      }
      function closeList(){
        if(inList){ html += "</ul>"; inList = false; }
      }

      for(let raw of lines){
        const line = raw.trimRight();
        if(!line.trim()){
          flushPara();
          closeList();
          continue;
        }

        const h4 = line.match(/^####\s+(.+)$/);
        if(h4){
          flushPara(); closeList();
          html += `<h4>${inlineFormat(escapeHtml(h4[1].trim()))}</h4>`;
          continue;
        }

        const li = line.match(/^[-*+]\s+(.*)$/);
        if(li){
          flushPara();
          if(!inList){ html += "<ul>"; inList = true; }
          html += `<li>${inlineFormat(escapeHtml(li[1].trim()))}</li>`;
          continue;
        }

        if(/^(Note|Tip):\s+/i.test(line)){
          flushPara(); closeList();
          const text = inlineFormat(escapeHtml(line.replace(/^(Note|Tip):\s+/i,"")));
          html += `<div class="callout"><p>${text}</p></div>`;
          continue;
        }

        if(/^(-{3,}|_{3,}|\*{3,})\s*$/.test(line.trim())){
          flushPara(); closeList();
          continue;
        }

        para.push(line.trim());
      }

      flushPara();
      closeList();
      return html;
    }

    let index = 0;

    const closeBtn = document.getElementById("closeGuide");
    const backdrop = document.getElementById("backdrop");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const dots = document.getElementById("dots");
    const navlist = document.getElementById("navlist");
    const content = document.getElementById("content");
    const pageEl = document.getElementById("page");
    const pageLayout = document.getElementById("pageLayout");
    const pageMedia = document.getElementById("pageMedia");

    function setAccent(color){
      document.documentElement.style.setProperty("--accent", color);
      document.documentElement.style.setProperty("--accentSoft", colorToRgba(color, 0.12));
    }
    function colorToRgba(hex, a){
      const h = hex.replace("#","");
      const r = parseInt(h.substring(0,2),16);
      const g = parseInt(h.substring(2,4),16);
      const b = parseInt(h.substring(4,6),16);
      return `rgba(${r},${g},${b},${a})`;
    }

    function renderNav(){
      navlist.innerHTML = "";
      PAGES.forEach((p, i) => {
        const li = document.createElement("li");
        li.className = "navitem" + (i === index ? " is-active" : "");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.setAttribute("aria-label", "Go to " + p.title);
        btn.innerHTML = `<div class="n">${String(i+1).padStart(2,"0")}</div><div class="t">${escapeHtml(p.title)}</div>`;
        btn.addEventListener("click", () => { index = i; render(); });
        li.appendChild(btn);
        navlist.appendChild(li);
      });
    }

    function renderDots(){
      dots.innerHTML = "";
      PAGES.forEach((_, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "dot" + (i === index ? " is-active" : "");
        b.setAttribute("aria-label", "Go to page " + (i+1));
        b.addEventListener("click", () => { index = i; render(); });
        dots.appendChild(b);
      });
    }

    function renderPageMedia(page){
      if(!pageLayout || !pageMedia){
        return;
      }

      try {
        pageLayout.classList.remove("has-media", "has-side-media", "has-below-media");
        pageMedia.innerHTML = "";

        const media = PAGE_MEDIA[page.title];
        if(!media || !Array.isArray(media.items) || media.items.length === 0){
          return;
        }

        const placement = media.placement === "side" ? "side" : "below";
        pageLayout.classList.add("has-media", `has-${placement}-media`);

        media.items.forEach((item, i) => {
          const figure = document.createElement("figure");
          const variantClass = typeof item.variant === "string" ? item.variant.trim() : "";
          figure.className = "page-media-figure" + (variantClass ? ` ${variantClass}` : "");
          if(Number.isFinite(item.frameMaxWidth)){
            figure.style.setProperty("--media-frame-max-width", `${item.frameMaxWidth}px`);
            figure.style.justifySelf = "center";
          }

          const img = document.createElement("img");
          img.src = item.src;
          img.alt = item.alt || `${page.title} illustration ${i + 1}`;
          img.loading = i === 0 ? "eager" : "lazy";
          img.decoding = "async";
          if(Number.isFinite(item.width)){ img.width = item.width; }
          if(Number.isFinite(item.height)){ img.height = item.height; }
          img.addEventListener("error", () => {
            figure.remove();
            if(pageMedia.children.length === 0){
              pageLayout.classList.remove("has-media", "has-side-media", "has-below-media");
            }
          });

          figure.appendChild(img);
          pageMedia.appendChild(figure);
        });
      } catch (_error) {
        pageLayout.classList.remove("has-media", "has-side-media", "has-below-media");
        pageMedia.innerHTML = "";
      }
    }

    function render(){
      const p = PAGES[index];
      setAccent(p.accent || "#1f6f8b");
      prevBtn.disabled = (index === 0);
      nextBtn.disabled = (index === PAGES.length - 1);

      pageEl.scrollTop = 0;
      content.innerHTML = "";

      p.blocks.forEach(b => {
        const block = document.createElement("section");
        block.className = "block";

        const heading = (b.heading || "").trim();
        const bodyHtml = mdToHtml(b.body || "");

        if(heading){
          const h = document.createElement("h3");
          h.className = "blocktitle";
          h.textContent = heading;
          content.appendChild(h);
        }
        block.innerHTML = bodyHtml;
        content.appendChild(block);
      });

      renderPageMedia(p);
      renderDots();
      renderNav();
    }

    function closeGuide(){
      if (EMBED_MODE && window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "typomatique-guide-close" }, "*");
        return;
      }
      if (window.history.length > 1) {
        window.history.back();
        return;
      }
      window.location.href = "index.html";
    }

    closeBtn.addEventListener("click", closeGuide);
    backdrop.addEventListener("click", closeGuide);

    prevBtn.addEventListener("click", () => { if(index>0){ index--; render(); } });
    nextBtn.addEventListener("click", () => { if(index<PAGES.length-1){ index++; render(); } });

    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape"){
        e.preventDefault();
        closeGuide();
      }else if(e.key === "ArrowLeft"){
        e.preventDefault();
        if(index>0){ index--; render(); }
      }else if(e.key === "ArrowRight"){
        e.preventDefault();
        if(index<PAGES.length-1){ index++; render(); }
      }
    });

    render();
  </script>
</body>
</html>
