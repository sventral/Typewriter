<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Typewriter (Lite)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
        --page-w: 900;
        --page-width-px: calc(var(--page-w) * 1px);
        --page-height-px: 1273px;
        
        --stage-bg-light:#d1d1d3;
        --page-bg-light:#f7f5ee;
        --ui:#ffffff;
        --ui-border:#d0d0d0;
        --ui-text:#1f1f1f;
        --stage-bg:var(--stage-bg-light);
        --page-bg:var(--page-bg-light);
        --btn-bg:#f4f4f4;
        --btn-fg:#1f1f1f;
        --btn-border:#c6c6c6;
        --btn-hover:#ededed;
        --btn-active:#e6e6e6;
        --ruler-bg: rgba(255,255,255,0.4);
        --ruler-tick: rgba(0,0,0,0.55);
        --tri-color:#5c5c5c;
        --tri-red:#b00000;
        --toolbar-h:48px;
        --tri-h:12px;
        --caret-color:#111111;
        --page-shadow:0 8px 24px rgba(0,0,0,0.10);
    }

    html,body{
        margin:0; height:100%; 
        background:var(--stage-bg); 
        font:16px system-ui, -apple-system, sans-serif;
        color:var(--ui-text); overflow: hidden;
    }

    .toolbar{
        box-sizing:border-box; position:fixed; left:0; right:0; bottom:0; height:var(--toolbar-h);
        z-index:51; display:flex; align-items:center; justify-content: space-between;
        padding:.6rem .8rem; background:var(--ui); color:var(--ui-text);
        border-top:1px solid var(--ui-border);
    }
    .toolbar-left, .toolbar-right { display:flex; align-items:center; gap:.5rem; }
    
    .btn{
        box-sizing:border-box; border:1px solid var(--btn-border);
        background:var(--btn-bg); color:var(--btn-fg); padding:.2rem .6rem;
        border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center;
        line-height:1.2rem; font-weight:500; min-width:36px; height:30px;
        font-size: 14px; user-select: none;
    }
    .btn:hover{ background:var(--btn-hover) } 
    .btn:active{ background:var(--btn-active) }
    .btn.icon-only { padding: 0; min-width: 30px; width: 30px; }
    .btn.icon-only .icon { width: 18px; height: 18px; }
    .sw{display:inline-block;width:16px;height:16px;border:1px solid rgba(0,0,0,.25);border-radius:3px}
    .sw.black{background:#1f2024} .sw.red{background:#b00000} .sw.white{background:#f7f5ee}
    
    .doc-controls { position: relative; display: flex; align-items: center; gap: .35rem; }
    .doc-title-input {
        box-sizing: border-box; height: 30px; padding: .25rem .5rem;
        border-radius: 6px; border: 1px solid var(--btn-border);
        background: var(--btn-bg); color: var(--btn-fg);
        width: clamp(160px, 18vw, 240px); font-size: 14px;
    }

    .stage{
        height:100vh; 
        overflow: hidden; 
        position:relative;
        display:flex; align-items:flex-start; justify-content:center;
    }
    .stage:focus{ outline:none; }
    
    .zoom-wrap{ 
        transform-origin: top center; 
        display:flex; justify-content:center; 
        will-change: transform;
    }
    
    .stage-inner{
        display:flex; flex-direction:column; align-items:center; gap:16px;
        will-change: transform;
        padding: 40px 0; 
    }

    .page-wrap{ width:calc(var(--page-w) * 1px); margin:0 auto 16px; position:relative; }
    .page{ 
        width:100%; height: var(--page-height-px);
        background:var(--page-bg); box-shadow:var(--page-shadow); 
        position:relative; overflow:hidden; cursor: text;
    }
    .page canvas{ display:block; width:100%; height:100%; }
    
    .caret{ 
        position:absolute; width:2px; background:var(--caret-color); 
        pointer-events:none; animation:blink 1s steps(1) infinite; 
        height: 20px;
    }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .ruler{ position:fixed; left:0; bottom:var(--toolbar-h); height:16px; z-index:50; display:block; overflow:hidden; pointer-events:none; width:100%; }
    #rulerH_stops_container { position:absolute; inset:0; pointer-events:auto; }
    .ruler-ticks{ position:absolute; inset:0; background:var(--ruler-bg); border-top:1px solid var(--ruler-tick); box-sizing:border-box; }
    .tick{ position:absolute; bottom:0; width:1px; background:var(--ruler-tick); }
    .tick.major{ height:100% } .tick.medium{ height:60% } .tick.minor{ height:30% }
    .tri{ position:absolute; bottom:0; width:0; height:0; cursor:ew-resize; border-left:8px solid transparent; border-right:8px solid transparent; border-bottom:var(--tri-h) solid var(--tri-color); transform:translateX(-50%); z-index:2; }
    .tri.right{border-bottom-color:var(--tri-red)}

    .ruler-v{ position:fixed; left:0; top:0; width:16px; z-index:50; display:block; overflow:hidden; pointer-events:none; height:calc(100% - var(--toolbar-h)); }
    #rulerV_stops_container { position:absolute; inset:0; pointer-events:auto; }
    .ruler-v-ticks{ position:absolute; inset:0; background:var(--ruler-bg); border-right:1px solid var(--ruler-tick); box-sizing:border-box; }
    .tick-v{ position:absolute; right:0; height:1px; background:var(--ruler-tick); }
    .tick-v.major{ width:100% } .tick-v.medium{ width:60% } .tick-v.minor{ width:30% }
    .tri-v{ position:absolute; left:0; width:0; height:0; cursor:ns-resize; border-top:8px solid transparent; border-bottom:8px solid transparent; border-left:var(--tri-h) solid var(--tri-color); transform:translateY(-50%); z-index:2; }
    .tri-v.bottom{border-left-color:var(--tri-red)}

    .guide{ position:fixed; display:none; pointer-events:none; z-index:100; }
    #guideH{ left:0; right:0; height:0; border-top:1px dashed var(--tri-color); }
    #guideV{ top:0; bottom:0; width:0; border-left:1px dashed var(--tri-color); }

    .zoom-controls{ position:fixed; right:0px; top:16px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:52; }
    .slider{ position:relative; width:60px; height:calc(122px + 2px + 14px); pointer-events:none; }
    .track{ position:absolute; top:0; left:50%; transform:translateX(-50%); width:4.1px; height:122px; border:1px solid var(--tri-color); border-radius:35px; background:transparent; overflow:hidden; pointer-events:none; }
    .fill{ position:absolute; left:0; right:0; bottom:0; height:50%; background:var(--tri-color); pointer-events:none; will-change:height; }
    .thumb{ position:absolute; left:50%; top: 50%; transform:translate(-50%, -50%); width:13px; height:13px; border-radius:50%; background:var(--tri-color); pointer-events:auto; touch-action:none; cursor:ns-resize; }
    .thumb:active{ filter:brightness(0.97); }
    #zoomIndicator{ background:var(--btn-bg); color:var(--btn-fg); padding:2px 6px; border-radius:4px; font-size:12px; font-family:sans-serif; border:1px solid var(--btn-border); }

    .app-version{ position:fixed; top:8px; left:12px; font-size:12px; color:var(--ui-text); opacity:0.7; z-index:120; pointer-events:none; }
  </style>
</head>
<body>
  <div class="app-version">v.Lite</div>

  <div id="guideV" class="guide"></div>
  <div id="guideH" class="guide"></div>

  <div class="ruler" id="rulerH_host">
    <div class="ruler-ticks" id="rulerH_ticks"></div>
    <div id="rulerH_stops_container"></div>
  </div>

  <div class="ruler-v" id="rulerV_host">
    <div class="ruler-v-ticks" id="rulerV_ticks"></div>
    <div id="rulerV_stops_container"></div>
  </div>

  <div class="zoom-controls" id="zoomControls">
    <div class="slider" id="zoomSlider">
      <div class="track" id="zoomTrack">
        <div class="fill" id="zoomFill"></div>
      </div>
      <div class="thumb" id="zoomThumb"></div>
    </div>
    <div id="zoomIndicator">100%</div>
  </div>

  <div id="stage" class="stage" tabindex="0">
    <div class="zoom-wrap" id="zoomWrap">
      <div class="stage-inner" id="stageInner"></div>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <div class="doc-controls">
        <button class="btn icon-only" title="Documents">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M4 5.25a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H4.75A.75.75 0 0 1 4 5.25Zm0 4a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H4.75A.75.75 0 0 1 4 9.25Zm0 4a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H4.75A.75.75 0 0 1 4 13.25Z"/></svg>
        </button>
        <input class="doc-title-input" type="text" value="Untitled Document" readonly />
      </div>
      <button class="btn icon-only"><svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M7.25 3a1 1 0 0 1 .97-.75h3.56a1 1 0 0 1 .97.75l.3 1.25h3.75a.75.75 0 0 1 0 1.5h-.7l-.73 10.01A2.25 2.25 0 0 1 12.13 18H7.87a2.25 2.25 0 0 1-2.24-2.24L4.9 5.75h-.65a.75.75 0 0 1 0-1.5h3.75ZM6.4 5.75l.7 9.72c.05.4.38.7.77.7h4.26c.4 0 .73-.3.77-.7l.7-9.72H6.4Zm3.1 2a.75.75 0 0 1 .75.75v4.5a.75.75 0 0 1-1.5 0v-4.5a.75.75 0 0 1 .75-.75Z"/></svg></button>
      <button class="btn icon-only"><svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M10 3a.75.75 0 0 1 .75.75v5.5h5.5a.75.75 0 0 1 0 1.5h-5.5v5.5a.75.75 0 0 1-1.5 0v-5.5h-5.5a.75.75 0 0 1 0-1.5h5.5v-5.5A.75.75 0 0 1 10 3Z"/></svg></button>
      <button class="btn">Export</button>
    </div>
    <div class="toolbar-right">
      <button class="btn">Settings</button>
      <button class="btn">Margins</button>
      <div class="ink-control-group"><button class="btn"><span class="sw black"></span></button></div>
      <div class="ink-control-group"><button class="btn"><span class="sw red"></span></button></div>
      <div class="ink-control-group"><button class="btn"><span class="sw white"></span></button></div>
    </div>
  </div>

  <script>
    const CONFIG = {
        pageW: 900, 
        pageH: 1273, 
        marginL: 96, 
        marginR: 96, 
        marginT: 96, 
        marginB: 96, 
        charW: 10, 
        lineH: 18,
        font: '16px "Courier New", Courier, monospace'
    };

    const state = {
        pages: [],
        activePageIndex: 0,
        cursor: { x: CONFIG.marginL, y: CONFIG.marginT },
        drag: null,
        paperOffset: { x: 0, y: 0 },
        zoom: 1
    };

    const stageInner = document.getElementById('stageInner');
    const stage = document.getElementById('stage');
    const guideV = document.getElementById('guideV');
    const guideH = document.getElementById('guideH');
    const zoomWrap = document.getElementById('zoomWrap');

    function init() {
        addPage();
        setupInteractions();
        setupZoomSlider();
        
        nudgePaper();
        
        window.addEventListener('keydown', handleTyping);
        stage.addEventListener('click', handleStageClick);
        
        window.addEventListener('resize', () => {
            nudgePaper();
            syncRulers();
        });
        
        stage.addEventListener('wheel', (e) => {
            e.preventDefault();
            state.paperOffset.x -= e.deltaX / state.zoom;
            state.paperOffset.y -= e.deltaY / state.zoom;
            clampPaperOffset();
            applyPaperOffset();
        }, { passive: false });
    }

    function addPage() {
        const index = state.pages.length;
        const wrap = document.createElement('div');
        wrap.className = 'page-wrap';
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';
        const canvas = document.createElement('canvas');
        
        const dpr = window.devicePixelRatio || 1;
        canvas.width = CONFIG.pageW * dpr;
        canvas.height = CONFIG.pageH * dpr;
        canvas.style.width = CONFIG.pageW + 'px';
        canvas.style.height = CONFIG.pageH + 'px';

        const caret = document.createElement('div');
        caret.className = 'caret';
        caret.style.height = CONFIG.lineH + 'px';
        
        pageDiv.appendChild(canvas);
        pageDiv.appendChild(caret);
        wrap.appendChild(pageDiv);
        stageInner.appendChild(wrap);

        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);
        ctx.font = CONFIG.font;
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#1f1f1f';

        state.pages.push({ wrap, canvas, ctx, caretEl: caret });

        setActivePage(index);
        
        if (index > 0) {
            state.cursor.x = CONFIG.marginL;
            state.cursor.y = CONFIG.marginT;
        }

        updateCaretVisuals();
        
        if(index > 0) nudgePaper();
    }

    function setActivePage(index) {
        if (state.pages[state.activePageIndex]) {
            state.pages[state.activePageIndex].caretEl.style.display = 'none';
        }
        state.activePageIndex = index;
        if (state.pages[index]) {
            state.pages[index].caretEl.style.display = 'block';
        }
    }

    function updateCaretVisuals() {
        const page = state.pages[state.activePageIndex];
        page.caretEl.style.left = state.cursor.x + 'px';
        page.caretEl.style.top = state.cursor.y + 'px';
    }

    function handleStageClick(e) {
        const pageEl = e.target.closest('.page');
        if (!pageEl) {
            stage.focus();
            return;
        }

        const index = state.pages.findIndex(p => p.wrap.contains(pageEl));
        if (index === -1) return;

        setActivePage(index);

        const rect = pageEl.getBoundingClientRect();
        const relX = (e.clientX - rect.left) / state.zoom;
        const relY = (e.clientY - rect.top) / state.zoom;

        const snapX = Math.round(relX / CONFIG.charW) * CONFIG.charW;
        const snapY = Math.round(relY / CONFIG.lineH) * CONFIG.lineH;

        state.cursor.x = Math.max(0, Math.min(snapX, CONFIG.pageW - CONFIG.charW));
        state.cursor.y = Math.max(0, Math.min(snapY, CONFIG.pageH - CONFIG.lineH));

        updateCaretVisuals();
        stage.focus();
        nudgePaper();
    }

    function nudgePaper() {
        const page = state.pages[state.activePageIndex];
        if (!page || !page.caretEl) return;

        const rect = page.caretEl.getBoundingClientRect();
        
        const ax = window.innerWidth / 2;
        const ay = window.innerHeight * 0.5; 

        const dx = ax - rect.left;
        const dy = ay - rect.top;

        state.paperOffset.x += (dx / state.zoom);
        state.paperOffset.y += (dy / state.zoom);

        clampPaperOffset();
        applyPaperOffset();
    }

    function clampPaperOffset() {
        const vw = window.innerWidth / state.zoom;
        const vh = window.innerHeight / state.zoom;
        
        const limitX = CONFIG.pageW / 2;
        
        if (state.paperOffset.x > limitX) state.paperOffset.x = limitX;
        if (state.paperOffset.x < -limitX) state.paperOffset.x = -limitX;

        const totalContentH = state.pages.length * (CONFIG.pageH + 16) + 80; // 16 margin + 80 padding
        
        const center = vh / 2;
        const limitTop = center - 40; // Top padding is 40
        const limitBot = center - totalContentH;

        if (state.paperOffset.y > limitTop) state.paperOffset.y = limitTop;
        if (state.paperOffset.y < limitBot) state.paperOffset.y = limitBot;
    }

    function applyPaperOffset() {
        stageInner.style.transform = `translate3d(${state.paperOffset.x}px, ${state.paperOffset.y}px, 0)`;
        syncRulers(); 
    }

    function syncRulers() {
        const hStops = document.getElementById('rulerH_stops_container');
        const hTicks = document.getElementById('rulerH_ticks');
        const vStops = document.getElementById('rulerV_stops_container');
        const vTicks = document.getElementById('rulerV_ticks');

        hTicks.innerHTML = '';
        vTicks.innerHTML = '';
        hStops.innerHTML = '';
        vStops.innerHTML = '';
        
        const activePage = state.pages[state.activePageIndex];
        if(!activePage) return;
        
        const rect = activePage.wrap.getBoundingClientRect();
        const pageLeft = rect.left;
        const pageTop = rect.top;

        const startDocUnitH = Math.floor((-pageLeft / state.zoom) / 10) * 10;
        const unitsOnScreenH = window.innerWidth / state.zoom;
        const endDocUnitH = startDocUnitH + unitsOnScreenH + 20;
        
        for(let i=startDocUnitH; i<=endDocUnitH; i+=10) {
            const tick = document.createElement('div');
            tick.className = (i%100===0) ? 'tick major' : 'tick minor';
            tick.style.left = (pageLeft + (i * state.zoom)) + 'px';
            hTicks.appendChild(tick);
        }

        const startDocUnitV = Math.floor((-pageTop / state.zoom) / 10) * 10;
        const unitsOnScreenV = window.innerHeight / state.zoom;
        const endDocUnitV = startDocUnitV + unitsOnScreenV + 20;
        
        for(let i=startDocUnitV; i<=endDocUnitV; i+=10) {
            const tick = document.createElement('div');
            tick.className = (i%100===0) ? 'tick-v major' : 'tick-v minor';
            tick.style.top = (pageTop + (i * state.zoom)) + 'px';
            vTicks.appendChild(tick);
        }
        
        const mL = createTri('left', pageLeft + (CONFIG.marginL * state.zoom));
        const mR = createTri('right', pageLeft + ((CONFIG.pageW - CONFIG.marginR) * state.zoom));
        hStops.appendChild(mL);
        hStops.appendChild(mR);
        
        const mT = createTriV('top', pageTop + (CONFIG.marginT * state.zoom));
        const mB = createTriV('bottom', pageTop + ((CONFIG.pageH - CONFIG.marginB) * state.zoom));
        vStops.appendChild(mT);
        vStops.appendChild(mB);
    }

    function createTri(side, left) {
        const div = document.createElement('div');
        div.className = `tri ${side}`;
        div.style.left = left + 'px';
        div.dataset.side = side;
        return div;
    }

    function createTriV(side, top) {
        const div = document.createElement('div');
        div.className = `tri-v ${side}`;
        div.style.top = top + 'px';
        div.dataset.side = side;
        return div;
    }

    function setupInteractions() {
        const hContainer = document.getElementById('rulerH_host');
        const vContainer = document.getElementById('rulerV_host');

        hContainer.addEventListener('pointerdown', e => {
            const tri = e.target.closest('.tri');
            if(!tri) return;
            e.preventDefault();
            state.drag = { type: 'h', side: tri.dataset.side, el: tri };
            guideV.style.display = 'block';
            document.addEventListener('pointermove', handleDrag);
            document.addEventListener('pointerup', endDrag);
        });

        vContainer.addEventListener('pointerdown', e => {
            const tri = e.target.closest('.tri-v');
            if(!tri) return;
            e.preventDefault();
            state.drag = { type: 'v', side: tri.dataset.side, el: tri };
            guideH.style.display = 'block';
            document.addEventListener('pointermove', handleDrag);
            document.addEventListener('pointerup', endDrag);
        });
    }

    function handleDrag(e) {
        if(!state.drag) return;
        
        const activePage = state.pages[state.activePageIndex];
        const rect = activePage.wrap.getBoundingClientRect();

        if (state.drag.type === 'h') {
            let x = e.clientX;
            let relX = x - rect.left;
            relX = relX / state.zoom;
            relX = Math.round(relX / CONFIG.charW) * CONFIG.charW;
            
            if (state.drag.side === 'left') {
                relX = Math.max(0, Math.min(relX, CONFIG.pageW - CONFIG.marginR - CONFIG.charW));
                CONFIG.marginL = relX;
            } else {
                let rightPos = CONFIG.pageW - relX;
                rightPos = Math.max(0, Math.min(rightPos, CONFIG.pageW - CONFIG.marginL - CONFIG.charW));
                CONFIG.marginR = rightPos;
                relX = CONFIG.pageW - rightPos;
            }
            
            syncRulers();
            guideV.style.left = (rect.left + (relX * state.zoom)) + 'px';
            
        } else if (state.drag.type === 'v') {
            let y = e.clientY;
            let relY = y - rect.top;
            relY = relY / state.zoom;
            relY = Math.round(relY / CONFIG.lineH) * CONFIG.lineH;

            if (state.drag.side === 'top') {
                relY = Math.max(0, Math.min(relY, CONFIG.pageH - CONFIG.marginB - CONFIG.lineH));
                CONFIG.marginT = relY;
            } else {
                let botPos = CONFIG.pageH - relY;
                botPos = Math.max(0, Math.min(botPos, CONFIG.pageH - CONFIG.marginT - CONFIG.lineH));
                CONFIG.marginB = botPos;
                relY = CONFIG.pageH - botPos;
            }
            
            syncRulers();
            guideH.style.top = (rect.top + (relY * state.zoom)) + 'px';
        }
    }

    function endDrag() {
        state.drag = null;
        guideV.style.display = 'none';
        guideH.style.display = 'none';
        document.removeEventListener('pointermove', handleDrag);
        document.removeEventListener('pointerup', endDrag);
        if (state.cursor.x < CONFIG.marginL) state.cursor.x = CONFIG.marginL;
        updateCaretVisuals();
        nudgePaper(); 
    }

    function setupZoomSlider() {
        const slider = document.getElementById('zoomSlider');
        const thumb = document.getElementById('zoomThumb');
        const fill = document.getElementById('zoomFill');
        const indicator = document.getElementById('zoomIndicator');
        const track = document.getElementById('zoomTrack');

        indicator.style.opacity = '0';
        indicator.style.transition = 'opacity 0.2s ease';

        let isZoomDragging = false;

        const minZoom = 0.5;
        const maxZoom = 4.0;
        const initialPct = (1 - minZoom) / (maxZoom - minZoom);
        
        const rect = track.getBoundingClientRect();
        const initFillH = initialPct * rect.height;
        const initThumbY = (1 - initialPct) * rect.height - 6.5;
        fill.style.height = (initialPct * 100) + '%';
        thumb.style.top = initThumbY + 'px';

        slider.addEventListener('pointerdown', (e) => {
            isZoomDragging = true;
            indicator.style.opacity = '1';
            thumb.setPointerCapture(e.pointerId);
            updateSlider(e);
        });

        slider.addEventListener('pointermove', (e) => {
            if(isZoomDragging) updateSlider(e);
        });

        slider.addEventListener('pointerup', (e) => {
            isZoomDragging = false;
            indicator.style.opacity = '0';
            thumb.releasePointerCapture(e.pointerId);
        });

        function updateSlider(e) {
            const rect = track.getBoundingClientRect();
            let val = 1 - (e.clientY - rect.top) / rect.height;
            val = Math.max(0, Math.min(1, val));
            
            let targetZoom = minZoom + (val * (maxZoom - minZoom));

            if (targetZoom > 0.92 && targetZoom < 1.08) {
                targetZoom = 1.0;
                val = (targetZoom - minZoom) / (maxZoom - minZoom);
            }

            state.zoom = targetZoom;

            const fillH = val * rect.height;
            const thumbY = (1 - val) * rect.height - 6.5;
            
            fill.style.height = (val * 100) + '%';
            thumb.style.top = thumbY + 'px';
            
            const zoomDisplay = Math.round(state.zoom * 100);
            indicator.textContent = zoomDisplay + '%';

            zoomWrap.style.transform = `scale(${state.zoom})`;
            nudgePaper();
            syncRulers();
        }
    }

    function handleTyping(e) {
        const page = state.pages[state.activePageIndex];
        const ctx = page.ctx;

        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
            ctx.fillText(e.key, state.cursor.x, state.cursor.y);
            state.cursor.x += CONFIG.charW;
            if (state.cursor.x > (CONFIG.pageW - CONFIG.marginR)) newLine();
        } else if (e.key === 'Enter') {
            newLine();
        } else if (e.key === 'Backspace') {
            if (state.cursor.x > CONFIG.marginL) {
                state.cursor.x -= CONFIG.charW;
                ctx.clearRect(state.cursor.x, state.cursor.y, CONFIG.charW, CONFIG.lineH);
            } else if (state.cursor.y > CONFIG.marginT) {
                state.cursor.y -= CONFIG.lineH;
                state.cursor.x = CONFIG.pageW - CONFIG.marginR;
            }
        } else if (e.key === 'Space') {
            state.cursor.x += CONFIG.charW;
                if (state.cursor.x > (CONFIG.pageW - CONFIG.marginR)) newLine();
        }
        updateCaretVisuals();
        nudgePaper(); 
    }

    function newLine() {
        state.cursor.x = CONFIG.marginL;
        state.cursor.y += CONFIG.lineH;

        if (state.cursor.y > (CONFIG.pageH - CONFIG.marginB)) {
            if (state.activePageIndex < state.pages.length - 1) {
                state.activePageIndex++;
                setActivePage(state.activePageIndex);
                state.cursor.y = CONFIG.marginT;
                updateCaretVisuals();
                nudgePaper();
            } else {
                addPage();
            }
        }
    }

    init();
  </script>
</body>
</html>
