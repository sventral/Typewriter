<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TypeSim Dropbox Auth</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Courier New", Courier, monospace;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f1e8;
      color: #1f1f1f;
    }
    .dropbox-auth-card {
      max-width: 460px;
      padding: 20px 24px;
      border: 1px solid rgba(0, 0, 0, 0.18);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 16px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }
    .dropbox-auth-status--error {
      color: #b23a3a;
      font-weight: 600;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #13161d;
        color: #e8e8e8;
      }
      .dropbox-auth-card {
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(20, 24, 33, 0.82);
        box-shadow: 0 16px 38px rgba(0, 0, 0, 0.45);
      }
      .dropbox-auth-status--error {
        color: #ff8f8f;
      }
    }
  </style>
</head>
<body>
  <main class="dropbox-auth-card" role="status" aria-live="polite">
    <h1>Dropbox Authorization</h1>
    <p id="dropboxAuthStatus">Waiting for Dropbox authorization response...</p>
  </main>

  <script src="https://unpkg.com/dropbox/dist/Dropbox-sdk.min.js"></script>
  <script type="module" src="js/storage/dropboxAuthCallback.js"></script>
</body>
</html>
